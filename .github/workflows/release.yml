name: Build and Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Get version string
        id: version
        run: echo "version=v$(date -u +'%Y%m%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Delete previous rolling release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous rolling tag
        run: git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create release
        run: |
          gh release create latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Launcher ${{ steps.version.outputs.version }}" \
            --notes "Built from commit ${{ github.sha }} on ${{ github.ref_name }}." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
