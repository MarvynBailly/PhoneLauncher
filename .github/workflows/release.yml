name: CI Build

# Build-only sanity check. Releases are cut from the maintainer's machine via
# release.sh so the APK is signed with the stable local debug keystore that
# matches existing installs (required for in-place Obtainium/OTA upgrades).
# A GitHub runner generates a fresh debug keystore per run, so CI must NOT
# publish APKs or Obtainium updates would fail with a signature mismatch.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
